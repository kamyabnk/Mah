services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mah
      POSTGRES_PASSWORD: mah_dev_password
      POSTGRES_DB: mah_candle
    ports:
      - "5433:5432"
    volumes:
      - mah_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mah -d mah_candle"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mah_postgres_data:
